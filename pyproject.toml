[project]
name = "ai-usage"
description = "Session and weekly quotas for the Claude Code, Codex and Antigravity CLIs."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/hrytsenko/ai-usage"

[project.scripts]
ai-usage = "ai_usage.usage:main"

[dependency-groups]
dev = ["ruff==0.16.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ai_usage/__init__.py"
